<!doctype html>
<meta charset="utf-8">
<title>evlog — the world</title>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<style>
  :root { color-scheme: dark; --ink: #eef2ee; --dim: #a7b2ab; --line: #ffffff22; --panel: #10161499; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0d; color: var(--ink);
    font: 13px/1.5 "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif; }
  /* A canvas is as big as its drawing buffer unless it is told otherwise, and the buffer is the
     window times the pixel ratio: without a size here it is twice the window on a retina screen. */
  canvas#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .ui { position: fixed; background: var(--panel); backdrop-filter: blur(9px); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  #hud { top: 12px; left: 12px; min-width: 190px; }
  #hud b { font: 500 22px/1.15 "IBM Plex Mono", ui-monospace, monospace; display: block; font-variant-numeric: tabular-nums; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; color: var(--dim); }
  #hud .row span:last-child { color: var(--ink); font-family: ui-monospace, monospace; }
  #panel { top: 12px; right: 12px; width: 208px; max-height: calc(100vh - 150px); overflow-y: auto; }
  #panel h4 { margin: 2px 0 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #panel hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0 9px; }
  label.chk { display: flex; align-items: center; gap: 7px; padding: 1px 0; cursor: pointer; }
  label.rng { display: block; color: var(--dim); margin-top: 6px; }
  label.rng input { width: 100%; }
  #seasonbox { display: flex; align-items: center; gap: 10px; margin: 7px 0 6px; padding: 6px 0;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #seasonbox > div { flex: 1; min-width: 0; }
  #dial { width: 48px; height: 48px; flex: none; }
  #seasonname { font-weight: 600; font-size: 15px; letter-spacing: .04em; }
  #bar { left: 50%; transform: translateX(-50%); bottom: 12px; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; }
  #bar button { background: #ffffff14; color: var(--ink); border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 11px; font-size: 13px; cursor: pointer; }
  #bar button:hover { background: #ffffff24; }
  #bar input[type=range] { width: 150px; }
  #bar #seek { width: 240px; }
  #bar input[type=number] { width: 92px; background: #ffffff10; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; font-family: ui-monospace, monospace; }
  #bar .sep { width: 1px; height: 22px; background: var(--line); }
  #mini { position: fixed; right: 12px; bottom: 12px; width: 168px; height: 168px; border-radius: 10px;
    border: 1px solid var(--line); cursor: crosshair; background: #0b0f0d; }
  #sel { color: var(--dim); }
  #sel button { background: #ffffff14; color: var(--ink); border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px; margin-top: 7px; cursor: pointer; }
  #sel button:hover { background: #ffffff28; }
  #sel .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  #shape { display: grid; gap: 1px; margin: 6px 0; padding: 3px; background: #ffffff14; border-radius: 4px; }
  #shape i { width: 100%; aspect-ratio: 1; border-radius: 1px; outline: 1px solid #00000030; }
  .muted { color: var(--dim); font-size: 12px; }
  #legend span { display: inline-block; margin-right: 9px; white-space: nowrap; }
  #legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
</style>

<canvas id="view"></canvas>

<div class="ui" id="hud">
  <b id="step">—</b>
  <div class="row"><span>bodies</span><span id="pop">—</span></div>
  <div id="seasonbox">
    <canvas id="dial" width="96" height="96"></canvas>
    <div>
      <div id="seasonname">—</div>
      <div class="row"><span>暦</span><span id="year">—</span></div>
      <div class="row"><span>この場所の陽</span><span id="localsun">—</span></div>
    </div>
  </div>
  <div class="row"><span>at</span><span id="where">—</span></div>
  <div class="row"><span>fps</span><span id="fps">—</span></div>
</div>

<div class="ui" id="panel">
  <h4>見えるもの</h4>
  <label class="chk"><input type="checkbox" id="v-grass" checked> 草</label>
  <label class="chk"><input type="checkbox" id="v-trees" checked> 木</label>
  <label class="chk"><input type="checkbox" id="v-fruit" checked> 落ちた実</label>
  <label class="chk"><input type="checkbox" id="v-carrion" checked> 死骸</label>
  <label class="chk"><input type="checkbox" id="v-bodies" checked> 体</label>
  <hr>
  <h4>地形</h4>
  <label class="rng">起伏 <input type="range" id="s-terrain" min="0.05" max="1" step="0.01" value="0.28"></label>
  <label class="rng">植物の高さ <input type="range" id="s-plant" min="0.1" max="1.5" step="0.05" value="0.5"></label>
  <label class="rng">草木の精細 <input type="range" id="s-detail" min="0" max="2" step="1" value="1"></label>
  <label class="chk"><input type="checkbox" id="v-shadow" checked> 影</label>
  <hr>
  <h4>選んだ体</h4>
  <div id="sel">
    <div id="selempty" class="muted">クリックで選ぶ</div>
    <div id="selbody" hidden>
      <div id="shape"></div>
      <div id="selrows"></div>
      <button id="unfollow">追うのをやめる (Esc)</button>
    </div>
  </div>
  <hr>
  <h4>凡例</h4>
  <div id="legend"></div>
</div>

<div class="ui" id="bar">
  <button id="play">⏸</button>
  <button id="stepone" title="1フレーム進める">⏭</button>
  <span class="sep"></span>
  <span class="muted">速さ</span>
  <input type="range" id="speed" min="-1" max="3" step="0.02" value="1.3">
  <span id="speedv" class="muted" style="width:74px">—</span>
  <span class="sep"></span>
  <input type="range" id="seek" min="0" max="1" step="1" value="0">
  <input type="number" id="goto" placeholder="step">
  <button id="gotob">移動</button>
  <span class="sep"></span>
  <span id="mode" class="muted">—</span>
</div>

<canvas id="mini" width="168" height="168"></canvas>

<script type="module" src="./js/main.js"></script>
