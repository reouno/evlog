<!doctype html>
<meta charset="utf-8">
<title>evlog — the map</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<style>
  :root { color-scheme: dark; --ink: #eef2ee; --dim: #a7b2ab; --line: #ffffff22; --panel: #10161499; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f0d; color: var(--ink);
    font: 13px/1.5 "Hiragino Sans", system-ui, sans-serif; }
  canvas#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  .ui { position: fixed; background: var(--panel); backdrop-filter: blur(9px); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; }
  #hud { top: 12px; left: 12px; min-width: 220px; }
  #hud b { font: 500 20px/1.2 ui-monospace, monospace; display: block; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; color: var(--dim); }
  #hud .row span:last-child { color: var(--ink); font-family: ui-monospace, monospace; }
  #time { left: 50%; transform: translateX(-50%); bottom: 12px; display: grid; grid-template-columns: auto 1fr auto;
    gap: 6px 10px; align-items: center; width: min(560px, calc(100vw - 24px)); }
  #time input[type=range] { width: 100%; }
  #time button { background: #ffffff14; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 10px; cursor: pointer; font: inherit; }
  #time .v { font-family: ui-monospace, monospace; min-width: 64px; text-align: right; }
  #mini { right: 12px; bottom: 12px; padding: 6px; }
  #mini canvas { display: block; width: 220px; height: 220px; cursor: crosshair; image-rendering: pixelated; }
  #help { top: 12px; right: 12px; color: var(--dim); max-width: 260px; }
  #load { top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
<canvas id="view"></canvas>
<div id="hud" class="ui">
  <b id="date">—</b>
  <div class="row"><span>時刻</span><span id="clock">—</span></div>
  <div class="row"><span>視点の場所</span><span id="where">—</span></div>
  <div class="row"><span>標高</span><span id="elev">—</span></div>
  <div class="row"><span>緯度</span><span id="lat">—</span></div>
  <div class="row"><span>気温（いま）</span><span id="temp">—</span></div>
  <div class="row"><span>年平均気温</span><span id="tmean">—</span></div>
  <div class="row"><span>年降水量</span><span id="rain">—</span></div>
  <div class="row"><span>視点の高さ</span><span id="eye">—</span></div>
</div>
<div id="help" class="ui">
  ドラッグで回す、右ドラッグで動かす、ホイールで寄る。WASD で歩く（Shift で速く）。右下の地図をクリックで飛ぶ。<br>
  植物はまだない。地面の緑は、気候がどれだけ緑を許すかの目安。
</div>
<div id="time" class="ui">
  <span>日付</span><input id="day" type="range" min="0" max="364" step="1" value="120"><span class="v" id="dayv"></span>
  <span>時刻</span><input id="hour" type="range" min="0" max="24" step="0.25" value="11"><span class="v" id="hourv"></span>
  <span></span>
  <div><button id="playYear">季節を進める</button> <button id="playDay">一日を進める</button></div>
  <span></span>
</div>
<div id="mini" class="ui"><canvas id="minimap" width="320" height="320"></canvas></div>
<div id="load" class="ui">地図を読み込み中…</div>
<script type="module" src="js/map.js"></script>
