[workspace]
resolver = "2"
members = ["experiments/*", "viewer"]
# An experiment that runs no world of its own (e094 re-read the censuses we had) has no crate.
exclude = ["experiments/e094_hold", "experiments/e099_stock", "experiments/e101_unit"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"

[profile.release]
debug = 1
